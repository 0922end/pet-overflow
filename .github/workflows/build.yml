name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
      - name: Build with Gradle
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Find APK
        run: |
          echo "=== search workspace ==="
          find $GITHUB_WORKSPACE -name "*.apk" -type f 2>/dev/null
          echo "=== search gradle user home ==="
          find /home/runner/.gradle -name "*.apk" -type f 2>/dev/null
          echo "=== search android sdk ==="
          find /usr/local/lib/android -name "*.apk" -type f 2>/dev/null
          echo "=== build dir ==="
          ls -laR build/ 2>/dev/null | head -30
          echo "=== app build dir ==="
          ls -laR app/build/ 2>/dev/null | head -30
      - name: Try gradle properties
        run: |
          gradle properties 2>&1 | grep -i -E "buildDir|output|apk" | head -10
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log