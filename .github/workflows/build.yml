name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
      - name: Build with Gradle
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Find APK
        run: |
          find /home/runner -name "*.apk" -type f 2>/dev/null > apk-list.txt
          cat apk-list.txt
          if [ -s apk-list.txt ]; then
            cp $(head -1 apk-list.txt) pet-overflow.apk
            echo "APK found!"
          else
            echo "NO APK FOUND"
            ls -la app/build/ 2>/dev/null || echo "no app/build dir"
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pet-overflow-apk
          path: pet-overflow.apk