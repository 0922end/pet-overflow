name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
      - name: Build with Gradle
        run: |
          gradle assembleDebug --stacktrace
      - name: List outputs
        run: |
          echo "=== app/build/outputs ==="
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "no debug dir"
          echo "=== app/build/outputs full ==="
          find app/build -name "*.apk" 2>/dev/null
          echo "=== gradle home ==="
          find $HOME/.gradle -name "*.apk" 2>/dev/null | head -5
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pet-overflow-apk
          path: "**/*.apk"