name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List source files
        run: |
          find . -name "*.kt" -o -name "*.kts" -o -name "*.xml" -o -name "*.gradle" | sort
          echo "---"
          cat app/build.gradle.kts
          echo "---"
          cat settings.gradle.kts 2>/dev/null || echo "no settings"
          echo "---"
          cat app/src/main/AndroidManifest.xml 2>/dev/null || echo "no manifest"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
      - name: Build with Gradle
        run: |
          gradle assembleDebug --stacktrace 2>&1
      - name: Check outputs
        run: |
          echo "=== buildDir ==="
          ls -la build/ 2>/dev/null || echo "no build dir"
          echo "=== app/build ==="
          ls -la app/build/ 2>/dev/null || echo "no app/build dir"
          echo "=== find any apk ==="
          find / -name "*.apk" -type f 2>/dev/null || echo "no apk found anywhere"
          echo "=== check intermediates ==="
          ls -laR app/build/intermediates/apk/ 2>/dev/null | head -20 || echo "no intermediates"