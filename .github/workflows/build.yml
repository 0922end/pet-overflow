name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
      - name: Build with Gradle
        run: |
          gradle assembleDebug --stacktrace 2>&1 | tee build.log
      - name: Find APK everywhere
        run: |
          find / -type f -name "*.apk" 2>/dev/null > apk-locations.txt
          cat apk-locations.txt
          head -1 apk-locations.txt | xargs -I{} cp {} pet-overflow.apk 2>/dev/null || echo "no apk found"
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pet-overflow-apk
          path: pet-overflow.apk
      - name: Upload search log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-locations
          path: apk-locations.txt