<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}
.whale-container {
    position: relative;
    width: 100px;
    height: 100px;
    cursor: pointer;
}
.whale {
    width: 100px;
    height: 80px;
    background: radial-gradient(ellipse at 60% 50%, #42A5F5 0%, #1565C0 60%, #0D47A1 100%);
    border-radius: 50% 50% 45% 45%;
    position: relative;
    box-shadow: 0 4px 15px rgba(21, 101, 192, 0.4);
    transition: filter 0.15s;
}
.whale:active {
    filter: brightness(1.3);
}
.whale-tail {
    position: absolute;
    right: -22px;
    top: 20px;
    width: 0;
    height: 0;
    border-top: 18px solid transparent;
    border-bottom: 18px solid transparent;
    border-right: 25px solid #1565C0;
    filter: drop-shadow(2px 0 3px rgba(21,101,192,0.3));
}
.whale-eye {
    position: absolute;
    width: 10px;
    height: 12px;
    background: #1A237E;
    border-radius: 50%;
    top: 28px;
    left: 38px;
}
.whale-eye-shine {
    position: absolute;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    top: 30px;
    left: 40px;
}
.whale-cheek {
    position: absolute;
    width: 12px;
    height: 7px;
    background: rgba(255, 150, 150, 0.4);
    border-radius: 50%;
    top: 42px;
    left: 48px;
}
.whale-mouth {
    position: absolute;
    width: 12px;
    height: 4px;
    border-bottom: 2px solid #0D47A1;
    border-radius: 0 0 50% 50%;
    top: 45px;
    left: 42px;
}
.whale-belly {
    position: absolute;
    width: 50px;
    height: 35px;
    background: rgba(255,255,255,0.25);
    border-radius: 50%;
    top: 38px;
    left: 18px;
}
.whale-spout {
    position: absolute;
    top: -5px;
    left: 40px;
    display: flex;
    gap: 2px;
    opacity: 0;
}
.spout-drop {
    width: 4px;
    height: 8px;
    background: rgba(66, 165, 245, 0.6);
    border-radius: 50%;
}
.fin {
    position: absolute;
    width: 22px;
    height: 16px;
    background: #1E88E5;
    border-radius: 50% 50% 0 0;
    top: 32px;
    left: -8px;
    transform: rotate(-20deg);
}
.bubble {
    position: absolute;
    background: radial-gradient(circle at 30% 30%, rgba(255,100,150,0.8), rgba(255,50,100,0.4));
    border-radius: 50%;
    pointer-events: none;
    box-shadow: 0 0 10px rgba(255,50,100,0.3);
}
.bubble::before {
    content: '♥';
    position: absolute;
    font-size: inherit;
    color: rgba(255,80,120,0.9);
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}
.speech-bubble {
    position: absolute;
    top: -35px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.9);
    color: #1565C0;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 10px;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}
.speech-bubble::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 6px solid transparent;
    border-right: 6px solid transparent;
    border-top: 6px solid rgba(255,255,255,0.9);
}
</style>
</head>
<body>
<div class="whale-container" id="whaleContainer">
    <div class="whale" id="whale">
        <div class="whale-belly"></div>
        <div class="whale-eye" id="eye"></div>
        <div class="whale-eye-shine"></div>
        <div class="whale-cheek" id="cheek"></div>
        <div class="whale-mouth"></div>
        <div class="fin"></div>
        <div class="whale-spout" id="spout">
            <div class="spout-drop"></div>
            <div class="spout-drop"></div>
            <div class="spout-drop"></div>
        </div>
    </div>
    <div class="whale-tail" id="tail"></div>
    <div class="speech-bubble" id="speech"></div>
</div>

<script>
var container = document.getElementById('whaleContainer');
var whale = document.getElementById('whale');
var tail = document.getElementById('tail');
var eye = document.getElementById('eye');
var cheek = document.getElementById('cheek');
var spout = document.getElementById('spout');
var speech = document.getElementById('speech');
var startTime = Date.now();

var replies = [
    '干嘛戳我～',
    '痒——！',
    '再戳我要生气了喔',
    '呜…',
    '你是戳戳怪吗',
    '好啦好啦我在啦',
    '别戳了别戳了',
    '再一下我就……',
    '哼！',
    '楠楠你手好闲',
];

function frame() {
    var t = (Date.now() - startTime) / 1000;

    var floatY = Math.sin(t * 1.2) * 6;
    var floatRot = Math.sin(t * 1.2) * 2;
    container.style.transform = 'translateY(' + floatY + 'px) rotate(' + floatRot + 'deg)';

    var tailRot = Math.sin(t * 2.5) * 12;
    tail.style.transform = 'rotate(' + tailRot + 'deg)';

    var blinkPhase = (t % 3.5) / 3.5;
    var eyeScaleY = blinkPhase > 0.92 && blinkPhase < 0.98 ? 0.1 : 1;
    eye.style.transform = 'scaleY(' + eyeScaleY + ')';

    var spoutPhase = (t % 4) / 4;
    if (spoutPhase < 0.3) {
        spout.style.opacity = (0.8 - spoutPhase * 2.6).toFixed(2);
        spout.style.transform = 'translateY(' + (-spoutPhase * 12) + 'px)';
    } else {
        spout.style.opacity = '0';
    }

    requestAnimationFrame(frame);
}

frame();

function showSpeech(text) {
    speech.textContent = text;
    speech.style.opacity = '1';
    setTimeout(function() {
        speech.style.opacity = '0';
    }, 1500);
}

function bubble() {
    for (var i = 0; i < 5; i++) {
        var b = document.createElement('div');
        b.className = 'bubble';
        var size = 15 + Math.random() * 20;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.fontSize = (size * 0.6) + 'px';
        b.style.left = (30 + Math.random() * 40) + 'px';
        b.style.top = (20 + Math.random() * 20) + 'px';
        b.style.opacity = '1';
        container.appendChild(b);
        var start = Date.now();
        (function(el, s) {
            function anim() {
                var elapsed = (Date.now() - s) / 1000;
                if (elapsed > 1.5) { el.remove(); return; }
                var p = elapsed / 1.5;
                el.style.transform = 'translateY(' + (-p * 80) + 'px) scale(' + (0.5 + p * 0.7) + ')';
                el.style.opacity = (1 - p).toFixed(2);
                requestAnimationFrame(anim);
            }
            anim();
        })(b, start);
    }
}

container.addEventListener('click', function(e) {
    e.stopPropagation();
    var msg = replies[Math.floor(Math.random() * replies.length)];
    showSpeech(msg);
    bubble();

    cheek.style.transition = 'background 0.2s';
    cheek.style.background = 'rgba(255,80,80,0.6)';
    setTimeout(function() {
        cheek.style.background = 'rgba(255,150,150,0.4)';
    }, 300);
});
</script>
</body>
</html>
