<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}
.whale-container {
    position: relative;
    width: 100px;
    height: 100px;
    animation: float 3s ease-in-out infinite;
}
@keyframes float {
    0%, 100% { transform: translateY(0px) rotate(-2deg); }
    50% { transform: translateY(-8px) rotate(2deg); }
}
.whale {
    width: 100px;
    height: 80px;
    background: radial-gradient(ellipse at 60% 50%, #42A5F5 0%, #1565C0 60%, #0D47A1 100%);
    border-radius: 50% 50% 45% 45%;
    position: relative;
    box-shadow: 0 4px 15px rgba(21, 101, 192, 0.4);
}
.whale-tail {
    position: absolute;
    right: -22px;
    top: 20px;
    width: 0;
    height: 0;
    border-top: 18px solid transparent;
    border-bottom: 18px solid transparent;
    border-right: 25px solid #1565C0;
    filter: drop-shadow(2px 0 3px rgba(21,101,192,0.3));
    animation: tailWag 1.5s ease-in-out infinite;
}
@keyframes tailWag {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(10deg); }
}
.whale-eye {
    position: absolute;
    width: 10px;
    height: 12px;
    background: #1A237E;
    border-radius: 50%;
    top: 28px;
    left: 38px;
    animation: blink 4s ease-in-out infinite;
}
@keyframes blink {
    0%, 96%, 100% { transform: scaleY(1); }
    98% { transform: scaleY(0.1); }
}
.whale-eye-shine {
    position: absolute;
    width: 4px;
    height: 4px;
    background: white;
    border-radius: 50%;
    top: 30px;
    left: 40px;
}
.whale-cheek {
    position: absolute;
    width: 12px;
    height: 7px;
    background: rgba(255, 150, 150, 0.4);
    border-radius: 50%;
    top: 42px;
    left: 48px;
}
.whale-mouth {
    position: absolute;
    width: 12px;
    height: 4px;
    border-bottom: 2px solid #0D47A1;
    border-radius: 0 0 50% 50%;
    top: 45px;
    left: 42px;
}
.whale-belly {
    position: absolute;
    width: 50px;
    height: 35px;
    background: rgba(255,255,255,0.25);
    border-radius: 50%;
    top: 38px;
    left: 18px;
}
.whale-spout {
    position: absolute;
    top: -5px;
    left: 40px;
    display: flex;
    gap: 2px;
    animation: spoutAnim 2s ease-in-out infinite;
    opacity: 0;
}
@keyframes spoutAnim {
    0%, 100% { opacity: 0; transform: translateY(0); }
    30% { opacity: 0.8; transform: translateY(-5px); }
    60% { opacity: 0.3; transform: translateY(-3px); }
}
.spout-drop {
    width: 4px;
    height: 8px;
    background: rgba(66, 165, 245, 0.6);
    border-radius: 50%;
}
.fin {
    position: absolute;
    width: 22px;
    height: 16px;
    background: #1E88E5;
    border-radius: 50% 50% 0 0;
    top: 32px;
    left: -8px;
    transform: rotate(-20deg);
}
.bubble {
    position: absolute;
    background: radial-gradient(circle at 30% 30%, rgba(255,100,150,0.8), rgba(255,50,100,0.4));
    border-radius: 50%;
    pointer-events: none;
    animation: bubbleUp 1.5s ease-out forwards;
    box-shadow: 0 0 10px rgba(255,50,100,0.3);
}
.bubble::before {
    content: '♥';
    position: absolute;
    font-size: inherit;
    color: rgba(255,80,120,0.9);
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
}
@keyframes bubbleUp {
    0% { transform: translateY(0) scale(0.5); opacity: 1; }
    100% { transform: translateY(-80px) scale(1.2); opacity: 0; }
}
</style>
</head>
<body>
<div class="whale-container" id="whaleContainer">
    <div class="whale">
        <div class="whale-belly"></div>
        <div class="whale-eye"></div>
        <div class="whale-eye-shine"></div>
        <div class="whale-cheek"></div>
        <div class="whale-mouth"></div>
        <div class="fin"></div>
        <div class="whale-spout">
            <div class="spout-drop"></div>
            <div class="spout-drop"></div>
            <div class="spout-drop"></div>
        </div>
    </div>
    <div class="whale-tail"></div>
</div>
<script>
function bubble() {
    const container = document.getElementById('whaleContainer');
    for (let i = 0; i < 5; i++) {
        const b = document.createElement('div');
        b.className = 'bubble';
        const size = 15 + Math.random() * 20;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.fontSize = (size * 0.6) + 'px';
        b.style.left = (30 + Math.random() * 40) + 'px';
        b.style.top = (20 + Math.random() * 20) + 'px';
        b.style.animationDelay = (i * 0.1) + 's';
        b.style.animationDuration = (1.2 + Math.random() * 0.6) + 's';
        container.appendChild(b);
        setTimeout(() => b.remove(), 2000);
    }
}
document.addEventListener('click', function(e) { bubble(); });
setInterval(function() {
    if (Math.random() > 0.7) bubble();
}, 8000);
</script>
</body>
</html>
